[workspace]
resolver = "3"
members = ["apps/cli","apps/desktop/src-tauri", "crates/common", "crates/database", "crates/embeddings", "crates/lang-parse"]

[profile.dev]
opt-level = 0
debug = 1
incremental = true
codegen-units = 256

[profile.release.package."*"]
opt-level = 3

[profile.release]
opt-level = 3          # Maximum optimization for speed
lto = "fat"            # Most aggressive cross-crate optimization
codegen-units = 1      # Best optimization opportunities
panic = "abort"        # Removes unwinding overhead
strip = true           # Smaller binary, faster loading
incremental = false    # Better final optimization
debug = false          # No debug info
overflow-checks = false
debug-assertions = false

[workspace.dependencies]
database = { path = "crates/database" }
common = { path = "crates/common" }
embeddings = { path = "crates/embeddings" }
lang-parse = { path = "crates/lang-parse" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono"] }
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "cuda", "tensorrt", "rocm", "coreml", "directml", "migraphx"] }
tokenizers = "0.23.1"
ndarray = "0.17.2"
sha2 = "0.11.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures = "0.3.33"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.5", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
